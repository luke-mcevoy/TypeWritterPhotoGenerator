<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carriage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="{{ url_for('wall') }}">Carriage</a>
            <div class="live-status" id="live-status">
                <span class="live-dot"></span>
                <span id="live-text">Studio</span>
            </div>
            {% include "_nav.html" %}
            <div class="topbar-actions">
                <button id="crop-btn" class="btn btn-ghost" type="button">Crop</button>
                <button id="change-image-btn" class="btn btn-ghost" type="button">Photo</button>
                <button id="download-image-btn" class="btn btn-ghost" type="button">Save</button>
                <button id="post-btn" class="btn btn-accent" type="button">Post</button>
            </div>
        </header>

        <div id="workspace" class="workspace">
            <aside class="rail">
                <div class="preset-row">
                    <button type="button" class="preset" data-preset="study">Study</button>
                    <button type="button" class="preset" data-preset="portrait">Portrait</button>
                    <button type="button" class="preset" data-preset="scene">Scene</button>
                    <button type="button" class="preset" data-preset="architecture">Building</button>
                </div>

                <div class="control-group">
                    <label for="drawing-style"><span class="label-text">Drawing style</span></label>
                    <div class="select-wrapper">
                        <select id="drawing-style">
                            <option value="refined" selected>Refined color</option>
                            <option value="ribbon">Earlier color</option>
                            <option value="monochrome">New monochrome</option>
                            <option value="original">Original algorithm</option>
                        </select>
                    </div>
                </div>
                <div class="control-group" id="color-controls">
                    <label for="color-amount-slider">
                        <span class="label-text">Color amount</span>
                        <output class="label-value" id="color-amount-value" for="color-amount-slider">70%</output>
                    </label>
                    <input type="range" id="color-amount-slider" min="0" max="100" value="70" step="1">
                    <p class="control-hint">0% no color · 100% full color.<br>Outlines and shadows stay fixed.</p>
                </div>

                <div class="control-group">
                    <label>
                        <span class="label-text">Columns</span>
                        <span class="label-value" id="columns-value">150</span>
                    </label>
                    <input type="range" id="columns-slider" min="80" max="200" value="150" step="10">
                </div>
                <div class="control-group">
                    <label>
                        <span class="label-text">Simplify</span>
                        <span class="label-value" id="simplify-value">0.55</span>
                    </label>
                    <input type="range" id="simplify-slider" min="0" max="1" value="0.55" step="0.05">
                </div>
                <div class="control-group">
                    <label>
                        <span class="label-text">Contrast</span>
                        <span class="label-value" id="contrast-value">1.40</span>
                    </label>
                    <input type="range" id="contrast-slider" min="0.8" max="2.2" value="1.4" step="0.05">
                </div>

                <details class="more">
                    <summary>More</summary>

                    <div class="control-group">
                        <label><span class="label-text">Keys</span></label>
                        <div class="select-wrapper">
                            <select id="charset-select">
                                <option value="portrait">Portrait</option>
                                <option value="scene">Scene</option>
                                <option value="architecture">Building</option>
                                <option value="classic" selected>Classic</option>
                                <option value="heavy">Heavy</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label><span class="label-text">Paper</span></label>
                        <div class="select-wrapper">
                            <select id="paper-select">
                                <option value="cream">Cream</option>
                                <option value="ivory">Ivory</option>
                                <option value="white" selected>White</option>
                                <option value="aged">Aged</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label><span class="label-text">Ribbon</span></label>
                        <div class="select-wrapper">
                            <select id="ink-select">
                                <option value="blue_black">Blue-black</option>
                                <option value="carbon" selected>Carbon</option>
                                <option value="navy">Navy</option>
                                <option value="sepia">Sepia</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group original-only hidden">
                        <label>
                            <span class="label-text">Detail</span>
                            <span class="label-value" id="detail-value">0.40</span>
                        </label>
                        <input type="range" id="detail-slider" min="0" max="1" value="0.4" step="0.05">
                    </div>
                    <div class="control-group">
                        <label>
                            <span class="label-text">Overstrike</span>
                            <span class="label-value" id="overstrike-value">1</span>
                        </label>
                        <input type="range" id="overstrike-slider" min="0" max="2" value="1" step="1">
                    </div>
                    <div class="control-group">
                        <label>
                            <span class="label-text">Pressure</span>
                            <span class="label-value" id="pressure-value">0.88</span>
                        </label>
                        <input type="range" id="pressure-slider" min="0.45" max="1.15" value="0.88" step="0.01">
                    </div>
                    <div class="control-group original-only hidden">
                        <label>
                            <span class="label-text">Wander</span>
                            <span class="label-value" id="wander-value">0.70</span>
                        </label>
                        <input type="range" id="wander-slider" min="0" max="1.4" value="0.7" step="0.05">
                    </div>
                    <div class="control-group contour-only">
                        <label>
                            <span class="label-text">Print</span>
                            <span class="label-value" id="scale-value">2</span>
                        </label>
                        <input type="range" id="scale-slider" min="1" max="3" value="2" step="1">
                    </div>
                    <div class="control-group original-only hidden">
                        <label><span class="label-text">Hidden line</span></label>
                        <input type="text" id="inscription-input" class="text-input" maxlength="240" placeholder="A name in the shade">
                    </div>
                    <label class="check-row original-only hidden">
                        <input type="checkbox" id="invert-check">
                        <span>Invert</span>
                    </label>
                    <div id="download-section" class="download-section hidden">
                        <button id="download-text-btn" class="btn btn-secondary hidden" type="button">TXT</button>
                        <button id="download-html-btn" class="btn btn-secondary hidden" type="button">HTML</button>
                        <div id="dimensions-info" class="dimensions-info"></div>
                    </div>
                </details>
            </aside>

            <section class="stage">
                <div class="stage-bar">
                    <div class="preview-tabs">
                        <button class="tab" data-tab="original">Photo</button>
                        <button class="tab active" data-tab="drawing">Drawing</button>
                        <button class="tab" data-tab="side-by-side">Both</button>
                    </div>
                    <div class="zoom-row">
                        <button type="button" class="zoom-btn active" data-zoom="fit">Fit</button>
                        <button type="button" class="zoom-btn" data-zoom="1">1:1</button>
                    </div>
                </div>

                <div class="preview-container" id="preview-container">
                    <div id="drop-zone" class="drop-zone">
                        <p class="drop-text">Drop a photograph</p>
                        <span class="drop-hint">It types as you adjust</span>
                        <input type="file" id="file-input" accept="image/*" hidden>
                    </div>
                    <div id="preview-original" class="preview-pane">
                        <img id="original-image" alt="Original">
                    </div>
                    <div id="preview-drawing" class="preview-pane active">
                        <div id="glyph-placeholder" class="placeholder hidden">
                            <p></p>
                        </div>
                        <img id="glyph-image" alt="Typewriter drawing" class="hidden page-shot">
                    </div>
                    <div id="preview-side-by-side" class="preview-pane side-by-side">
                        <div class="side-pane">
                            <img id="side-original" alt="Original">
                        </div>
                        <div class="side-pane">
                            <div id="side-glyph-placeholder" class="placeholder small hidden"><p></p></div>
                            <img id="side-glyph" alt="Typewriter drawing" class="hidden page-shot">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <section id="crop-section" class="crop-modal hidden">
        <div class="crop-card">
            <h2>Crop</h2>
            <div class="crop-container">
                <img id="crop-image" alt="Crop">
            </div>
            <div class="crop-actions">
                <button id="skip-crop-btn" class="btn btn-secondary" type="button">Cancel</button>
                <button id="apply-crop-btn" class="btn btn-primary crop-apply-btn" type="button">Apply</button>
            </div>
        </div>
    </section>

    <section id="post-modal" class="crop-modal hidden">
        <div class="crop-card post-card">
            <h2>Post to the wall</h2>
            <p class="auth-lead">This drawing will be visible to anyone on Carriage.</p>
            <label class="post-caption-label">A line, if you like
                <input type="text" id="post-caption" class="text-input" maxlength="280" placeholder="Sunday lunch, typed">
            </label>
            <div class="crop-actions">
                <button id="cancel-post-btn" class="btn btn-secondary" type="button">Cancel</button>
                <button id="confirm-post-btn" class="btn btn-primary crop-apply-btn" type="button">Post</button>
            </div>
        </div>
    </section>

    <script>
        window.CARRIAGE = {
            signedIn: {{ "true" if current_user else "false" }},
            loginUrl: {{ url_for("login", next="/studio") | tojson }},
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}?v=color2"></script>
</body>
</html>
